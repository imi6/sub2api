name: Billing Build

# Builds one self-contained linux/amd64 binary (frontend embedded) from
# local/billing and publishes it to the rolling "billing-latest" pre-release.
#
# Download URL:
#   https://github.com/<owner>/<repo>/releases/download/billing-latest/sub2api-zzs

on:
  push:
    branches:
      - local/billing
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: billing-build-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: billing-latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # Outputs to backend/internal/web/dist (vite outDir), embedded by -tags=embed.
      - run: pnpm run build
        working-directory: frontend
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build sub2api-zzs
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          version="$(tr -d '[:space:]' < cmd/server/VERSION)-billing.${GITHUB_SHA::7}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -tags=embed -trimpath \
            -ldflags="-s -w -X main.Version=${version} -X main.Commit=${GITHUB_SHA} -X main.Date=${build_date} -X main.BuildType=release" \
            -o ../sub2api-zzs ./cmd/server
          cd .. && sha256sum sub2api-zzs > sub2api-zzs.sha256
      - name: Publish to billing-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Recreate so the tag always points at the commit that was built.
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag || true
          gh release create "${RELEASE_TAG}" sub2api-zzs sub2api-zzs.sha256 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Billing build ${GITHUB_SHA::7}" \
            --notes "Automated build of local/billing at ${GITHUB_SHA}."
